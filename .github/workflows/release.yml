name: release

# A matching version tag verifies the source, builds installers and publishes.
#
# They are signed when the secrets below exist. Without them they are signed
# ad hoc on macOS and not at all on Windows: good to try, not good to hand to
# anybody (Gatekeeper, and the approval of the macOS service, expect a
# Developer ID signature).
#
#   EGGBOX_SIGN_IDENTITY       Developer ID Application identity (macOS)
#   EGGBOX_INSTALLER_IDENTITY  Developer ID Installer identity (macOS)
#   EGGBOX_CERTIFICATE         base64 of the .p12 holding both
#   EGGBOX_CERTIFICATE_PASSWORD

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GOFLAGS: -trimpath

jobs:
  version:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the application version
        run: |
          python3 - <<'PY'
          import json, os, sys
          expected = 'v' + json.load(open('mygo.json'))['version']
          if os.environ['GITHUB_REF_NAME'] != expected:
              sys.exit(f'Release tag must be {expected}; update mygo.json before tagging.')
          PY

  verify:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      installers: false

  macos:
    needs: verify
    runs-on: macos-15-intel
    env:
      # Here, because a step cannot ask whether a secret exists, only whether
      # an environment variable is not empty.
      EGGBOX_CERTIFICATE: ${{ secrets.EGGBOX_CERTIFICATE }}
      EGGBOX_CERTIFICATE_PASSWORD: ${{ secrets.EGGBOX_CERTIFICATE_PASSWORD }}
      EGGBOX_SIGN_IDENTITY: ${{ secrets.EGGBOX_SIGN_IDENTITY }}
      EGGBOX_INSTALLER_IDENTITY: ${{ secrets.EGGBOX_INSTALLER_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache-name: macos-package

      - name: Import the signing certificate
        if: env.EGGBOX_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/eggbox.keychain-db"
          password="$(uuidgen)"
          echo "$EGGBOX_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$EGGBOX_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Build
        run: |
          export EGGBOX_VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$EGGBOX_SIGN_IDENTITY" ] || unset EGGBOX_SIGN_IDENTITY
          [ -n "$EGGBOX_INSTALLER_IDENTITY" ] || unset EGGBOX_INSTALLER_IDENTITY
          packaging/macos/build.sh --arch universal

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/*.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache-name: cross-windows-${{ matrix.arch }}
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build
        run: |
          export EGGBOX_VERSION="${GITHUB_REF_NAME#v}"
          packaging/windows/build.sh --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: build/windows/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Android, an APK per ABI (64-bit phones, and the 32-bit ones still about),
  # signed with the release key. There is no release
  # without it: Android updates an installed app only with the same key, and a
  # debug key differs on every machine. The key's certificate is checked
  # against its fingerprint, which is public (docs/mobile.md).
  android:
    needs: verify
    runs-on: ubuntu-latest
    env:
      EGGBOX_ANDROID_KEYSTORE: ${{ secrets.EGGBOX_ANDROID_KEYSTORE }}
      MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EGGBOX_ANDROID_KEYSTORE_PASSWORD }}
      EGGBOX_ANDROID_CERT_SHA256: '3A:D4:2A:4F:4E:A4:F5:FD:F2:B8:51:A4:B3:73:7F:6A:34:E7:AB:8E:28:44:B2:3B:79:AA:04:CF:DB:B5:3C:37'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache-name: android-release
      - name: Release key
        run: |
          if [ -z "$EGGBOX_ANDROID_KEYSTORE" ] || [ -z "$MYGO_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::The Android release key is missing (EGGBOX_ANDROID_KEYSTORE, EGGBOX_ANDROID_KEYSTORE_PASSWORD)"
            exit 1
          fi
          echo "$EGGBOX_ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/eggbox-release.jks"
      - name: Build
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export EGGBOX_VERSION="${GITHUB_REF_NAME#v}"
          for abi in arm64 arm; do
            packaging/android/build.sh --keystore "$RUNNER_TEMP/eggbox-release.jks" --abi "$abi"
          done
          rm -f "$RUNNER_TEMP/eggbox-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [verify, macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

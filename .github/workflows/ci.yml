name: ci

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      installers:
        description: Build and upload both installers as well as running all checks
        type: boolean
        default: false
  workflow_call:
    inputs:
      installers:
        description: Build unsigned installers during verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  EGGBOX_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,badlinkname
  GOFLAGS: -trimpath

jobs:
  # Fail inexpensive checks before starting platform runners and the matrix.
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache-name: check
      - name: Native frontend only
        run: |
          found="$(git ls-files | grep -E '\.(js|jsx|mjs|cjs|ts|tsx)$|(^|/)package(-lock)?\.json$|(^|/)node_modules/' || true)"
          if [ -n "$found" ]; then
            echo "$found" >&2
            exit 1
          fi
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Shell scripts
        run: |
          git ls-files -z '*.sh' 'packaging/macos/scripts/*' | xargs -0 shellcheck
      - name: Workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Vet
        run: |
          go vet ./...
          go vet -tags "$EGGBOX_TAGS" ./...
          go vet -tags "eggbox_dev,$EGGBOX_TAGS" ./...
          go tool mygo vet
      - name: Backend tests (race detector)
        run: bash scripts/ci/backend-tests.sh -race -short -timeout 10m -count=1
      - name: Tests with the real engine
        run: go test -count=1 -timeout 15m -tags "eggbox_dev,$EGGBOX_TAGS" ./internal/agent/engine/... ./internal/agent/e2e/... ./internal/configgen/...

  gui:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache-name: gui
      - name: Interaction tests (race detector)
        run: go test -race -short -timeout 30m -count=1 ./internal/gui
      - name: Full-resolution screenshots (normal motion, both appearances)
        run: go test -count=1 -timeout 10m -run '^(TestShots|TestPanelShots)' ./internal/gui

  # The schedule scans for new advisories, without rebuilding unchanged apps.
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache-name: vulnerabilities
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags "$EGGBOX_TAGS" ./...

  # Shared GUI behaviour, including platform flavours, runs once on Linux.
  # Every other test still runs on its native OS, including filesystem tests.
  macos:
    needs: check
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache-name: macos-${{ inputs.installers && 'package' || 'test' }}
      - name: Native and backend tests (including Swift and real XPC)
        run: bash scripts/ci/backend-tests.sh -race -short -timeout 10m -count=1
      - name: Package (unsigned)
        if: inputs.installers
        run: packaging/macos/build.sh --arch universal
      - uses: actions/upload-artifact@v4
        if: inputs.installers
        with:
          name: macos-unsigned
          path: build/macos/*.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache-name: windows-${{ inputs.installers && 'package' || 'test' }}
      - name: Native and backend tests
        run: bash scripts/ci/backend-tests.sh -short -timeout 10m -count=1
      - name: Install NSIS
        if: inputs.installers
        run: choco install nsis -y --no-progress
      - name: Installer (unsigned)
        if: inputs.installers
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          packaging/windows/build.sh --arch amd64
      - uses: actions/upload-artifact@v4
        if: inputs.installers
        with:
          name: windows-unsigned
          path: build/windows/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  cross:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, analyze: true}
          - {goos: windows, goarch: amd64, analyze: true}
          - {goos: windows, goarch: arm64, analyze: false}
          - {goos: darwin, goarch: amd64, analyze: false}
          - {goos: darwin, goarch: arm64, analyze: true}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          cache-name: cross-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Staticcheck tool
        if: matrix.analyze
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Build and vet
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -tags "$EGGBOX_TAGS" ./...
          go vet -tags "eggbox_dev,$EGGBOX_TAGS" ./...
      - name: Static analysis
        if: matrix.analyze
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: staticcheck -tags "$EGGBOX_TAGS" ./...
